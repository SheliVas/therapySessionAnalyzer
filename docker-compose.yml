services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data

  upload_service:
    build:
      context: .
      dockerfile: Dockerfile.upload_service
    container_name: upload_service
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE: video.uploaded
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: therapy_analysis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    volumes:
      - ./data:/app/data

  audio_extractor_service:
    build:
      context: .
      dockerfile: Dockerfile.audio_extractor
    container_name: audio_extractor_service
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_QUEUE: video.uploaded
      AUDIO_OUTPUT_BASE_DIR: /app/data/audio
      AUDIO_EXTRACTED_QUEUE: audio.extracted
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: therapy_analysis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    volumes:
      - ./data:/app/data

  transcription_service:
    build:
      context: .
      dockerfile: Dockerfile.transcription_service
    container_name: transcription_service
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      AUDIO_EXTRACTED_QUEUE: audio.extracted
      TRANSCRIPT_CREATED_QUEUE: transcript.created
      TRANSCRIPT_OUTPUT_BASE_DIR: /app/data/transcripts
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: therapy_analysis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    volumes:
      - ./data:/app/data

  analysis_service:
    build:
      context: .
      dockerfile: Dockerfile.analysis_service
    container_name: analysis_service
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      TRANSCRIPT_CREATED_QUEUE: transcript.created
      ANALYSIS_COMPLETED_QUEUE: analysis.completed
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: therapy_analysis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL: 3600
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
    volumes:
      - ./data:/app/data

  report_service:
    build:
      context: .
      dockerfile: Dockerfile.report_service
    container_name: report_service
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: therapy_analysis
    ports:
      - "8001:8001"


